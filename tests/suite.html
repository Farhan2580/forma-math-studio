<!doctype html><meta charset="utf-8"><title>Forma extended lab checks</title>
<pre id="report">RUNNING</pre><iframe src="../index.html" style="width:1200px;height:1100px;border:0" title="Extended math lab"></iframe>
<script>
document.querySelector('iframe').onload=async()=>{
 const iframe=document.querySelector('iframe'),w=iframe.contentWindow,d=w.document,$=id=>d.getElementById(id),E=w.FormaEngine,L=w.FormaLabMath,checks=[];
 const assert=(ok,name)=>{if(!ok)throw Error(name);checks.push(name);},near=(a,b,t=1e-8)=>Math.abs(a-b)<t,calc=(s,angle='RAD')=>E.calculate(s,{},angle);
 const throws=(fn,pattern)=>{try{fn();return false;}catch(e){return !pattern||pattern.test(e.message);}};
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 const click=id=>$(id).click(),mode=name=>d.querySelector('[data-mode="'+name+'"]').click();
 const input=(id,value)=>{$(id).value=value;$(id).dispatchEvent(new w.Event('input',{bubbles:true}));};
 const choose=(id,value)=>{$(id).value=value;$(id).dispatchEvent(new w.Event('change',{bubbles:true}));};
 const sci=s=>{$('sci-expression').value=s;click('sci-keypad-button');};
 const sciCalc=s=>{$('sci-expression').value=s;d.querySelector('[data-action=equals]').click();return $('sci-result').textContent;};
 const run=()=>click('lab-calculate');
 try{
  assert(E&&L&&w.FormaLabs&&w.FormaScientific,'All modules load');
  assert(calc('2+3*4')===14&&calc('(2+3)*4')===20,'Operation precedence and parentheses');
  assert(calc('2^3^2')===512&&calc('-2^2')===-4&&calc('2^-3')===.125,'Power associativity and unary minus');
  assert(near(calc('.1+.2'),.3)&&calc('1.2e-3')===.0012,'Decimals and scientific notation');
  assert(calc('200*10%')===20&&calc('200+10%')===200.1,'Documented absolute percentage semantics');
  assert(near(calc('1/3+1/6'),.5)&&calc('2pi')===2*Math.PI,'Fractions and implicit multiplication');
  assert(calc('sqrt(9)+cbrt(-8)+root(-32,5)')===-1,'Real roots and odd negative roots');
  assert(calc('abs(-5)+5!')===125&&calc('npr(5,2)')===20&&calc('ncr(5,2)')===10,'Absolute factorial permutations combinations');
  assert(near(calc('sin(30)','DEG'),.5)&&near(calc('cos(pi)','RAD'),-1)&&near(calc('asin(.5)','DEG'),30),'Degree/radian and inverse trigonometry');
  assert(near(calc('ln(e)+log10(100)+log(8,2)'),6)&&near(calc('exp(1)'),Math.E)&&calc('pow10(3)')===1000,'Logarithms and exponentials');
  for(const expression of ['1/0','sqrt(-1)','ln(0)','acos(2)','root(-4,2)','(-1)!','171!','ncr(2,3)','10^1000','2+','foo(1)','constructor','window.alert(1)','2;3'])assert(throws(()=>calc(expression)),'Reject invalid expression '+expression);
  assert(throws(()=>calc('tan(90)','DEG'))&&throws(()=>calc('tan(pi/2)')),'Undefined tangent rejected');
  assert(throws(()=>calc('('.repeat(100)+'1'+')'.repeat(100))),'Nesting budget');
  const frac=E.fraction(1/3);assert(frac.numerator===1&&frac.denominator===3,'Fraction reconstruction');
  assert(E.evaluate(E.derivative(E.parse('x^3+sin(x)')),{x:0})===1,'Symbolic chain and power derivatives');
  assert(E.evaluate(E.derivative(E.parse('x^0')),{x:0})===0,'Constant power derivative at zero');
  assert(throws(()=>E.derivative(E.parse('abs(x)'))),'Unsupported derivative is explicit');
  assert(JSON.stringify(E.polynomial(E.parse('(x+1)*(x-1)')))==='[-1,0,1]','Polynomial expansion');
  assert(throws(()=>E.polynomial(E.parse('sin(x)'))),'Non-polynomial simplification rejected');
  let q=L.quadratic(1,0,1);assert(q.kind==='complex'&&q.real===0&&q.imaginary===1,'Complex quadratic roots');
  assert(L.quadratic(0,2,-6).solution.x===3,'Degenerate quadratic becomes linear');
  assert(L.simultaneous(1,1,5,2,-1,1).x===2&&L.simultaneous(1,1,5,2,-1,1).y===3,'Simultaneous system');
  assert(L.simultaneous(1,1,2,2,2,4).kind==='infinite'&&L.simultaneous(1,1,2,2,2,5).kind==='none'&&L.simultaneous(0,0,1,0,0,0).kind==='none','Dependent and contradictory systems');
  assert(L.geometry('triangle',{a:3,b:4,c:5}).area===6&&L.geometry('triangle',{a:3,b:4,c:5}).perimeter===12,'Triangle area/perimeter');
  assert(throws(()=>L.geometry('triangle',{a:1,b:2,c:3}))&&throws(()=>L.geometry('circle',{r:-1})),'Invalid geometry rejected');
  assert(L.geometry('rectangle',{w:3,h:4}).area===12&&L.geometry('square',{a:4}).perimeter===16,'Rectangle and square');
  assert(L.geometry('parallelogram',{a:6,b:5,h:4}).area===24&&L.geometry('trapezoid',{a:8,b:4,h:3,s:2}).area===18,'Parallelogram and general trapezoid');
  assert(L.geometry('pythagorean',{a:3,b:4}).dimensions.c===5,'Pythagorean theorem');
  assert(L.geometry('cube',{a:2}).volume===8&&L.geometry('cuboid',{w:2,h:3,d:4}).surface===52,'Cube and cuboid');
  assert(near(L.geometry('cylinder',{r:2,h:3}).volume,12*Math.PI)&&near(L.geometry('cone',{r:2,h:3}).volume,4*Math.PI)&&near(L.geometry('sphere',{r:2}).surface,16*Math.PI),'Cylinder cone sphere');
  let s=L.statistics([1,2,2,3,4]);assert(s.mean===2.4&&s.median===2&&s.mode[0]===2&&s.q1===1.5&&s.q3===3.5,'Statistics and declared quartile convention');
  s=L.statistics([1,2,3]);assert(near(s.populationVariance,2/3)&&s.sampleVariance===1,'Population/sample distinction');
  assert(L.statistics([5]).sampleVariance===null&&L.statistics([5]).iqr===0&&L.statistics([1,2,3]).mode.length===0,'Single observation and no-mode cases');
  s=L.statistics([1,2,3],[3,5,7]);assert(s.regression.slope===2&&s.regression.intercept===1&&s.regression.r2===1,'Linear regression');
  assert(throws(()=>L.statistics([1,1],[2,3]))&&throws(()=>L.statistics([1,2],[3])),'Invalid paired data');
  const A=[[1,2],[3,4]],B=[[5,6],[7,8]];assert(L.matrixOp(A,B,'multiply')[1][1]===50&&L.matrixOp(A,B,'add')[0][0]===6&&L.transpose(A)[0][1]===3,'Matrix arithmetic and transpose');
  assert(near(L.determinant(A),-2)&&near(L.inverse(A)[0][0],-2)&&near(L.solveMatrix(A,[5,11])[0],1),'Determinant inverse and solve');
  assert(near(L.determinant([[1,0],[0,1e-13]]),1e-13,1e-25),'Tiny nonzero determinant is not rounded to singular');
  assert(throws(()=>L.inverse([[1,2],[2,4]]))&&throws(()=>L.matrixOp([[1,2]],[[1,2]],'multiply')),'Singular and dimension errors');
  assert(L.vector([1,0,0],[0,1,0]).cross[2]===1&&L.vector([3,4],[1,2]).magnitudeA===5,'Vector magnitude dot cross');
  assert(throws(()=>L.vector([1,2],[1,2,3])),'Vector dimensions');
  let integers=L.integerTools('84','30');assert(integers.gcd==='6'&&integers.lcm==='420'&&integers.factors.join('*')==='2*2*3*7','GCD LCM factorization');
  assert(L.integerTools('97','0').prime&&L.integerTools('0','0').lcm==='0'&&!L.integerTools('-7','2').prime,'Prime zero and negative cases');
  assert(L.baseConvert('FF',16,2)==='11111111'&&L.baseConvert('-1010',2,10)==='-10'&&throws(()=>L.baseConvert('2',2,10)),'Exact base conversion validation');
  assert(near(L.convert('temperature',32,'°F','°C').value,0)&&near(L.convert('temperature',0,'K','°C').value,-273.15),'Affine temperature conversion');
  assert(throws(()=>L.convert('temperature',-1,'K','°C'))&&throws(()=>L.convert('length',1,'kg','m')),'Absolute zero and incompatible units');
  assert(near(L.convert('length',1,'mile','m').value,1609.344)&&near(L.convert('speed',36,'km/h','m/s').value,10),'Fixed length/speed conversions');
  assert(near(L.integrate(E.parse('x^2'),0,2).value,8/3)&&near(L.integrate(E.parse('sin(x)'),0,Math.PI).value,2),'Adaptive Simpson polynomial and sine');
  assert(near(L.integrate(E.parse('x'),1,-1).value,0)&&near(L.integrate(E.parse('1'),2,0).value,-2),'Signed integrals and reversed bounds');
  for(const source of ['1/x','1/(x-0.13)','tan(x)','ln(x)'])assert(throws(()=>L.integrate(E.parse(source),-2,2)),'Reject improper/domain integral '+source);
  assert(throws(()=>L.integrate(E.parse('sin(1e308*x)'),2,3)),'Intermediate overflow fails without an unbounded interval loop');
  assert(throws(()=>L.interval(E.parse('1/(x-0.13)'),.12,.14)),'Segment continuity detects shifted pole');
  assert(near(L.integrate(E.parse('e^x'),0,1).value,Math.E-1),'Variable-exponent exponential interval certification');
  mode('scientific');assert(!$('scientific').hidden&&d.querySelector('.workspace').hidden,'Scientific tab opens independently');
  assert(sciCalc('2+3*4')==='14','Scientific expression display');
  assert(sciCalc('123456789012345')==='123456789012345','Safe integer display preserves all digits');
  sciCalc('1/3');click('sci-fraction');assert($('sci-result').textContent.includes('1 / 3'),'Fraction display toggle');click('sci-fraction');
  sciCalc('sin(30)');assert($('sci-result').textContent.includes('0.5'),'Scientific DEG default');click('sci-rad');assert($('sci-rad').getAttribute('aria-pressed')==='true','RAD visible selection');
  assert(sciCalc('1/0')==='—'&&$('sci-error').textContent.includes('zero'),'Scientific error display');
  sciCalc('5');d.querySelector('[data-action=mplus]').click();d.querySelector('[data-action=clear]').click();d.querySelector('[data-action=mr]').click();assert($('sci-expression').value==='(5)','Memory recall');d.querySelector('[data-action=mc]').click();
  sciCalc('3');d.querySelector('[data-action=mminus]').click();d.querySelector('[data-action=clear]').click();d.querySelector('[data-action=mr]').click();assert($('sci-expression').value==='(-3)','Memory subtraction');d.querySelector('[data-action=mc]').click();
  $('sci-expression').value='12+345';$('sci-expression').setSelectionRange(6,6);d.querySelector('[data-action=entry]').click();assert($('sci-expression').value==='12+','Clear entry removes the current number');d.querySelector('[data-action=back]').click();assert($('sci-expression').value==='12','Backspace removes the previous character');
  sciCalc('7');assert(sciCalc('Ans+2')==='9','Ans reuses last result');
  assert($('sci-history').children.length>0&&JSON.parse(w.localStorage.getItem('forma.scientific.history.v1')).length>0,'History stored in localStorage');
  $('sci-history').querySelector('button').click();assert($('sci-expression').value==='Ans+2','History expression reuse');
  assert(sciCalc($('sci-expression').value)==='9','History restores the original Ans context');
  click('sci-history-clear');assert($('sci-history').children.length===0,'Clear stored history');
  $('sci-expression').value='2+5';$('sci-expression').dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));assert($('sci-result').textContent==='7','Scientific keyboard Enter');
  mode('algebra-lab');choose('algebra-tool','quadratic');input('alg-b',0);input('alg-c',1);run();assert($('lab-result').textContent.includes('i')&&!$('lab-error').textContent,'Quadratic UI complex roots');
  choose('algebra-tool','factor');input('alg-expression','x^3-1');run();assert($('lab-error').textContent.includes('degree')&&!$('lab-steps').children.length,'Unsupported factorization has no fabricated steps');
  choose('algebra-tool','simplify');input('alg-expression','x^2-x+1');run();assert($('lab-result').textContent.includes('+ 1'),'Canonical polynomial signs');
  choose('algebra-tool','factor');input('alg-expression','0');run();assert($('lab-steps').textContent.includes('not unique'),'Zero polynomial factorization is not unique');
  mode('geometry-lab');choose('geo-shape','triangle');input('geo-a',3);input('geo-b',4);input('geo-c',5);assert($('lab-result').textContent.includes('6 cm²')&&$('lab-visual').querySelector('polygon'),'Live labeled geometry');
  input('geo-c',8);assert($('lab-error').textContent.includes('triangle'),'Triangle UI invalid input');
  choose('geo-shape','pythagorean');assert($('lab-visual').textContent.includes('c = 5')&&$('lab-visual').textContent.includes('b = 4'),'Pythagorean diagram labels hypotenuse as c');
  mode('statistics');run();assert($('lab-result').textContent.includes('populationVariance')&&$('lab-visual').querySelector('svg'),'Statistics UI and histogram');
  w.FormaLabs.player.seek(8);assert($('lab-visual').textContent.includes('Box plot'),'Box plot step');
  input('stats-values','1, 2, 3');input('stats-paired','3, 5, 7');run();w.FormaLabs.player.seek(10);assert($('lab-visual').textContent.includes('scatter')&&$('lab-visual').querySelectorAll('circle').length===3,'Paired scatter plot and regression line');
  mode('matrix');run();assert($('lab-result').textContent.includes('50')&&$('lab-visual').querySelector('.matrix-highlight'),'Row-column matrix animation');
  click('lab-next');assert($('lab-step-status').textContent.includes('Step 2 of 4'),'Matrix step advances');
  input('mat-a-0-0',2);assert(!$('lab-steps').children.length&&$('lab-play').disabled,'Input invalidates old lab animation');
  choose('matrix-operation','vector');run();assert($('lab-result').textContent.includes('32'),'Vector UI');
  mode('tools');run();assert($('lab-result').textContent.includes('420'),'Integer UI');choose('number-tool','base');run();assert($('lab-result').textContent.includes('255'),'Base UI');choose('number-tool','unit');choose('unit-category','temperature');input('unit-value',32);choose('unit-from','°F');choose('unit-to','°C');run();assert($('lab-result').textContent.includes('≈ 0'),'Temperature UI');
  mode('calculus');choose('calc-tool','integral');run();assert($('lab-result').textContent.includes('Adaptive Simpson')&&$('lab-visual').querySelector('.riemann'),'Integral UI and signed rectangles');
  input('calc-function','1/(x-0.13)');input('calc-left',0);input('calc-right',1);run();assert($('lab-error').textContent.includes('pole'),'Integral UI rejects pole');
  choose('calc-tool','derivative');run();assert($('lab-result').textContent.includes('cos')&&$('lab-visual').querySelector('.tangent-point'),'Derivative and tangent UI');
  click('lab-next');click('lab-next');assert($('lab-visual').querySelector('.tangent-line'),'Tangent grows by steps');
  mode('graph');choose('graph-family','tan');await wait(400);
  assert(($('graph-curve').getAttribute('d').match(/M/g)||[]).length>1,'Tangent graph splits at asymptotes');
  input('graph-functions','1/(x-0.13)');click('graph-plot');await wait(100);assert(($('graph-curve').getAttribute('d').match(/M/g)||[]).length>1,'Shifted rational graph splits at its pole');
  input('graph-functions','sin(x)\nx\n1/x');click('graph-plot');await wait(100);
  assert($('graph-legend').children.length===3&&$('graph-features').textContent.includes('∩'),'Custom comparison and numerical intersections');
  const oldView=$('graph-svg').getAttribute('viewBox'),old=$('graph-curve').getAttribute('d');click('graph-zoom-in');assert($('graph-curve').getAttribute('d')!==old,'Graph zoom changes mathematical viewport');click('graph-left');click('graph-reset');
  input('graph-functions','constructor(1)');click('graph-plot');assert($('graph-error').textContent.length>0&&$('graph-draw').disabled,'Invalid custom function rejected');
  choose('graph-family','quadratic');await wait(400);
  if(d.documentElement.dataset.theme!=='light')click('theme-toggle');click('theme-toggle');assert(d.documentElement.dataset.theme==='dark','Dark theme');click('language-toggle');await wait(50);assert(d.documentElement.lang==='bn'&&d.querySelector('[data-mode=scientific]').textContent.includes('বৈজ্ঞানিক'),'Bengali navigation');click('language-toggle');click('theme-toggle');
  for(const name of ['scientific','algebra-lab','geometry-lab','calculus','statistics','matrix','tools','graph']){mode(name);iframe.style.width='320px';await wait(80);assert(d.documentElement.scrollWidth<=d.documentElement.clientWidth,'Mobile layout '+name);}
  document.getElementById('report').textContent='PASS '+checks.length+' checks\n'+checks.join('\n');
 }catch(e){document.getElementById('report').textContent='FAIL: '+e.message+'\nPassed '+checks.length+'\n'+checks.join('\n');}
};
</script>
