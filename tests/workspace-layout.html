<!doctype html><meta charset="utf-8"><title>All workspace layout checks</title><pre id="report">RUNNING</pre><iframe src="../index.html" style="width:1200px;height:1200px;border:0" title="All workspace layouts"></iframe><script>
document.querySelector('iframe').onload=async function(){const frame=this,w=frame.contentWindow,d=w.document,$=id=>d.getElementById(id),X=w.FormaWorkspace,checks=[],assert=(v,s)=>{if(!v)throw Error(s);checks.push(s);},wait=ms=>new Promise(r=>setTimeout(r,ms));try{
 for(const width of [320,390,768,1280,1600]){frame.style.width=width+'px';await wait(60);for(const mode of Object.keys(X.catalog)){X.applyExample(mode,0);await wait(0);assert(d.documentElement.scrollWidth<=width+1,'Layout fits '+mode+' at '+width);if(width===1600&&Object.hasOwn(w.FormaLabs.titles,mode)){const a=d.querySelector('.lab-controls').getBoundingClientRect(),b=d.querySelector('.lab-output').getBoundingClientRect(),c=d.querySelector('.lab-walkthrough').getBoundingClientRect();assert(a.right<=b.left+1&&b.right<=c.left+1,'Three-pane desktop workspace: '+mode);}if(width<=390&&Object.hasOwn(w.FormaLabs.titles,mode)){assert(d.querySelector('.lab-player').getBoundingClientRect().top< $('lab-steps').getBoundingClientRect().top,'Mobile controls precede long steps: '+mode);}if(width===320&&mode==='coordinates'){assert($('co-point-a').getBoundingClientRect().width>=43,'Coordinate touch target remains 44px at 320px');}if(width===320&&mode==='trig'){assert($('trig-point').getBoundingClientRect().width>=43,'Unit-circle touch target remains 44px at 320px');}}}
 frame.style.width='390px';await wait(60);X.applyExample('graph',0);X.setFocus(true);await wait(60);assert(d.documentElement.scrollWidth<=391&&w.getComputedStyle($('graph-play')).display!=='none','Mobile Graph focus keeps playback available');X.setFocus(false);X.applyExample('fraction',0);X.setFocus(true);await wait(60);assert(d.documentElement.scrollWidth<=391&&w.getComputedStyle(d.querySelector('.lab-player')).display!=='none','Mobile lab focus keeps playback available');X.setFocus(false);
 $('formula-open').click();await wait(15);assert($('formula-dialog').getBoundingClientRect().width<=390,'Formula dialog fits mobile');d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}));assert(!$('formula-dialog').open&&d.activeElement===$('formula-open'),'Escape closes reference and restores focus');$('library-open').click();await wait(15);assert($('workspace-library').getBoundingClientRect().width<=390,'Named-save dialog fits mobile');d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}));assert(!$('workspace-library').open&&d.activeElement===$('library-open'),'Escape closes saved library and restores focus');
 frame.style.width='1200px';X.applyExample('fraction',0);w.FormaLabs.player.seek(2.5);w.FormaLabs.player.pause();document.getElementById('report').textContent='PASS '+checks.length+' All-workspace layout assertions\n'+checks.join('\n');
 }catch(e){document.getElementById('report').textContent='FAIL '+e.stack;}};
</script>
