 run('1,2,3','5,5,5');P.seek(10);assert(w.FormaLabs.derivation.data.result.regression.r2===null&&w.FormaLabs.derivation.describe(10)[2].includes('undefined'),'Constant y has undefined R²');
 run('1,2,3','4,5');assert($('lab-error').textContent&&P.count===0,'Invalid paired length cancels lesson');run('1,1,1','1,2,3');assert($('lab-error').textContent&&P.count===0,'Identical x regression rejected');run('bad');assert($('stats-values').getAttribute('aria-invalid')==='true','Invalid observations have adjacent error');

 for(const width of [320,390,768,1280]){this.style.width=width+'px';await wait(60);assert(d.documentElement.scrollWidth<=width+1,'No page overflow at '+width);}
 this.style.width='1200px';run('2,4,6');P.seek(3.5);P.pause();document.getElementById('report').textContent='PASS '+checks.length+' Statistics teaching assertions\n'+checks.join('\n');
