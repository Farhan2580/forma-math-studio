<!doctype html><meta charset="utf-8"><title>Workspace real reload checks</title><pre id="report">RUNNING</pre><iframe src="../index.html" style="width:1200px;height:1200px;border:0" title="Workspace persistence"></iframe><script>
let phase=0,expected=null;const checks=[];const assert=(v,s)=>{if(!v)throw Error(s);checks.push(s);};
document.querySelector('iframe').onload=function(){const w=this.contentWindow,d=w.document,X=w.FormaWorkspace,$=id=>d.getElementById(id);try{
 if(phase===0){w.localStorage.removeItem(X.storageKey);X.applyExample('fraction',0);$('fr-an').value='9'.repeat(80);$('lab-calculate').click();X.saveNamed('Exact fraction after reload');const fraction=String(w.FormaLabs.derivation.data.result.n)+'/'+String(w.FormaLabs.derivation.data.result.d);X.applyExample('probability',1);const experiment=[...w.FormaLabs.derivation.data.outcomes].join();X.saveNamed('Recorded die after reload');X.applyExample('graph',1);$('graph-pin').click();w.FormaGraph.setCoefficients([1,0,-2],{instant:true});w.FormaGraph.setViewport([-3,5],[-5,20]);X.saveNamed('Graph after reload');expected={fraction,experiment,history:w.localStorage.getItem('forma.scientific.history.v1')};if(d.documentElement.dataset.theme!=='dark')$('theme-toggle').click();$('language-toggle').click();phase=1;w.location.reload();return;}
 const entries=X.readStore();assert(entries.length===3,'Named workspace list persists through a real reload');assert(d.documentElement.dataset.theme==='dark'&&d.documentElement.lang==='bn','Theme and language persist with new tools');X.restore(entries.find(e=>e.mode==='fraction'));assert(String(w.FormaLabs.derivation.data.result.n)+'/'+String(w.FormaLabs.derivation.data.result.d)===expected.fraction,'80-digit exact fraction reopens without rounding');X.restore(entries.find(e=>e.mode==='probability'));assert([...w.FormaLabs.derivation.data.outcomes].join()===expected.experiment,'Recorded simulation reopens identically after real reload');X.restore(entries.find(e=>e.mode==='graph'));assert(w.FormaGraph.snapshot().coeff.join()==='1,0,-2'&&w.FormaGraph.snapshot().view.join()==='-3,5','Graph function and viewport persist after reload');assert(w.FormaGraphTeaching.snapshot().coeff.join()==='-1,4,-3','Pinned comparison survives a real reload');assert(w.localStorage.getItem('forma.scientific.history.v1')===expected.history,'Named reopens preserve scientific history');assert($('formula-open').textContent.includes('সূত্র')&&$('library-open').textContent.includes('সংরক্ষিত'),'New labels initialize in the saved language');document.getElementById('report').textContent='PASS '+checks.length+' Workspace reload assertions\n'+checks.join('\n');
 }catch(e){document.getElementById('report').textContent='FAIL '+e.stack;}
};</script>
