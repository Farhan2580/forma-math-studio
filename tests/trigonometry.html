<!doctype html><meta charset="utf-8"><title>Trigonometry Lab checks</title><pre id="report">RUNNING</pre><iframe src="../index.html" style="width:1200px;height:1150px;border:0" title="Trigonometry test"></iframe><script>
document.querySelector('iframe').onload=async function(){
 const w=this.contentWindow,d=w.document,$=id=>d.getElementById(id),T=w.FormaTrigonometry,P=w.FormaLabs.player,checks=[],assert=(v,s)=>{if(!v)throw Error(s);checks.push(s);},near=(a,b)=>Math.abs(a-b)<1e-8,wait=ms=>new Promise(r=>setTimeout(r,ms)),click=id=>$(id).click();

 for(const width of [320,390,768,1280]){this.style.width=width+'px';await wait(60);assert(d.documentElement.scrollWidth<=width+1,'No page overflow at '+width);}
 this.style.width='1200px';input('trig-angle',45);P.pause();document.getElementById('report').textContent='PASS '+checks.length+' Trigonometry assertions\n'+checks.join('\n');
 }catch(e){document.getElementById('report').textContent='FAIL '+e.stack;}
};</script>
