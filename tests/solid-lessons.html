<!doctype html><meta charset="utf-8"><title>Solid geometry correctness</title><pre id="report">RUNNING</pre><iframe src="../index.html" style="width:1200px;height:1000px;border:0" title="Solid lessons"></iframe><script>
document.querySelector('iframe').onload=async function(){const w=this.contentWindow,d=w.document,$=id=>d.getElementById(id),G=w.FormaGeometry3D,P=w.FormaLabs.player,L=w.FormaLabMath,S=w.FormaSolidLessons,checks=[],wait=ms=>new Promise(r=>setTimeout(r,ms)),assert=(v,s)=>{if(!v)throw Error(s);checks.push(s);},near=(a,b)=>Math.abs(a-b)<1e-7;const choose=(id,v)=>{$(id).value=v;$(id).dispatchEvent(new w.Event('change',{bubbles:true}));},input=(id,v)=>{$(id).value=v;$(id).dispatchEvent(new w.Event('input',{bubbles:true}));};try{
 for(const [shape,p,volume,surface]of [['cube',{a:2},8,24],['cuboid',{w:2,d:3,h:4},24,52],['cylinder',{r:2,h:3},12*Math.PI,20*Math.PI],['cone',{r:3,h:4},12*Math.PI,24*Math.PI],['sphere',{r:3},36*Math.PI,36*Math.PI]]){const result=L.geometry(shape,p),m=S.model(shape,p,result,'cm',1.5);assert(near(result.volume,volume)&&near(result.surface,surface),'Existing formula preserved: '+shape);assert(m.volume===result.volume&&m.surface===result.surface,'Shared 2D/3D mathematical model: '+shape);}
 const cylinder=S.model('cylinder',{r:2,h:2.5},L.geometry('cylinder',{r:2,h:2.5}),'m',1);assert(cylinder.heights.join(',')==='1,1,0.5','Fractional final circular layer has correct height');const large=S.model('cuboid',{w:100,d:200,h:10000},L.geometry('cuboid',{w:100,d:200,h:10000}),'cm',2);assert(large.heights.length===8&&large.heights.reduce((a,b)=>a+b,0)===10000,'Large dimensions use exactly eight measured grouped layers');
 for(const pos of [0,.25,1.5,2.75,3]){const m=S.model('sphere',{r:4},L.geometry('sphere',{r:4}),'cm',pos);assert(near(m.sliceRadius*m.sliceRadius+m.sliceZ*m.sliceZ,16),'Sphere Pythagorean cross-section identity at '+pos);}
 w.FormaApp.selectMode('geometry-lab');choose('geo-shape','cylinder');P.seek(1);await G.setView('3d');await wait(100);assert(G.active&&G.parts.layers.length===6,'Cylinder real circular layers');assert(G.parts.layers.every(o=>o.visible),'Full cylinder height matches layer stack');P.seek(1.4);const geometry=G.parts.sheet.geometry,positions=geometry.attributes.position,vertices=positions.array.slice();P.seek(2);assert(geometry===G.parts.sheet.geometry,'Cylinder surface keeps persistent mesh');assert(vertices.some((v,i)=>v!==positions.array[i]),'Cylinder surface genuinely unrolls at intermediate progress');const N=G.parts.sheet.userData.N,R=G.adapter.model.r*2/G.adapter.model.scale;let length=0;for(let i=0;i<N;i++)length+=Math.hypot(positions.getX((i+1)*2)-positions.getX(i*2),positions.getZ((i+1)*2)-positions.getZ(i*2));assert(Math.abs(length-2*Math.PI*R)<2e-6,'Fully unrolled width is 2πr within Float32 mesh precision');assert(near(positions.getY(1)-positions.getY(0),2),'Unrolled height matches cylinder height at same scale');assert($('solid-caption').textContent.includes('Total S'),'Lateral and total surface are distinguished');
 choose('geo-shape','cone');await wait(150);assert(G.active&&d.querySelectorAll('#solid-viewport canvas').length===1,'Changing solid retains one renderer');P.seek(1.5);const model=G.adapter.model,cone=G.parts.cone.geometry.parameters,comparison=G.parts.comparison.geometry.parameters;assert(near(cone.height,comparison.height)&&near(cone.radius,comparison.radiusTop),'Cone/cylinder comparison has identical base and perpendicular height');assert(near(G.parts.slice.scale.x,cone.radius/2),'Cone middle slice uses radius r/2');assert(near(model.slant,Math.hypot(model.r,model.h)),'Cone slant height differs correctly from perpendicular height');assert($('solid-caption').textContent.includes('not a pouring proof'),'Illustrative comparison is honestly labeled');
 choose('geo-shape','sphere');await wait(150);P.seek(1.5);assert(near(G.parts.slice.scale.x,1)&&near(G.parts.plane.position.y,0),'Sphere central slice is a great circle');P.seek(0);assert(!G.parts.slice.visible&&near(G.parts.plane.position.y,-1),'Pole slice is a point, not a nonzero disk');$('solid-slice').value='.6';$('solid-slice').dispatchEvent(new w.Event('input',{bubbles:true}));assert(near(P.position,2.4)&&near(G.parts.slice.scale.x,.8),'Slice input controls the shared timeline and correct radius');assert($('solid-measures').textContent.includes('ρ'),'Slice measurements stay visible');
 const old=P.position;await G.setView('2d');assert(P.position===old&&d.querySelector('.solid-lesson-svg'),'Sphere SVG fallback uses same model');await G.setView('3d');await wait(100);assert(P.position===old,'Sphere progress survives 2D/3D switch');input('geo-r',0);await wait(80);assert(!G.active&&P.count===0&&$('geo-r').value==='0','Invalid dimensions preserve input, dispose scene and cancel old playback');input('geo-r',4);await wait(150);assert(P.count===4&&G.active,'Valid dimensions restore the lesson');
 for(let i=0;i<4;i++){w.FormaApp.selectMode('fraction');w.FormaApp.selectMode('geometry-lab');choose('geo-shape',i%2?'cube':'cylinder');await wait(120);assert(d.querySelectorAll('#solid-viewport canvas').length<=1,'No duplicate canvas on repeated switch '+i);}
 await G.setView('2d');w.FormaApp.selectMode('geometry-lab');choose('geo-shape','sphere');const canvasCreate=w.HTMLCanvasElement.prototype.getContext;w.HTMLCanvasElement.prototype.getContext=function(kind,...args){return kind==='webgl2'?null:canvasCreate.call(this,kind,...args);};await G.setView('3d');w.HTMLCanvasElement.prototype.getContext=canvasCreate;assert(!G.active&&$('solid-status').textContent.includes('WebGL2')&&!$('lab-visual').hidden,'Unavailable WebGL2 has usable 2D fallback');assert(P.count===4&&$('lab-result').textContent.includes('268'),'Fallback preserves mathematical answer');
 document.getElementById('report').textContent='PASS '+checks.length+' Solid lesson assertions\n'+checks.join('\n');}catch(e){document.getElementById('report').textContent='FAIL '+e.stack;}};
</script>
