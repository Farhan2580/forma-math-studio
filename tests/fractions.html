document.querySelector('iframe').onload=async function(){
 const w=this.contentWindow,d=w.document,F=w.FormaFractions,P=w.FormaLabs.player,$=id=>d.getElementById(id),checks=[],assert=(v,s)=>{if(!v)throw Error(s);checks.push(s);},wait=ms=>new Promise(r=>setTimeout(r,ms));

 choose('fr-example','sub');P.seek(2);const line=d.querySelector('.fr-direction').getAttribute('d');P.seek(2.5);assert(d.querySelector('.fr-direction').getAttribute('d')!==line,'Negative result uses an animated signed direction');P.seek(3);assert($('lab-result').textContent.includes('-1/6'),'Negative result shown exactly');

 choose('fr-example','mul');P.seek(2);assert(pic().dataset.selectedCells==='6'&&pic().dataset.totalCells==='12','Area overlap counts 6 out of 12');assert(pic().querySelector('.fr-overlap').getAttribute('width')!=='0','Nonzero overlap visible');run(0,1,5,2,'*');P.seek(2);assert(+pic().querySelector('.fr-overlap').getAttribute('width')===0,'Zero × improper fraction has zero overlap');
 choose('fr-example','div');P.seek(2);assert(pic().dataset.fullGroups==='1'&&pic().dataset.partialGroup==='1/2','Measurement model includes full and partial groups');assert($('lab-steps').textContent.includes('reciprocal'),'Measurement links to reciprocal after counting');
 choose('fr-example','improper');assert($('lab-result').textContent.includes('3/1')&&$('lab-result').textContent.includes('Mixed number'),'Improper result and mixed number display');run(100000,1,1,2,'/');assert(pic().querySelectorAll('[data-group]').length<=2&&$('lab-visual').textContent.includes('Grouped'),'Large quotient rendering bounded and labeled');
 run(1,997,1,991);P.seek(2);assert(pic().querySelectorAll('.fr-partition').length<100&&$('lab-visual').textContent.includes('Grouped'),'Huge common denominator does not create thousands of objects');
 run('9'.repeat(80),1,1,1);assert($('lab-result').textContent.includes((BigInt(big)+1n).toString()),'Large result UI never rounds through Number');
 run(1,0,1,2);assert($('fr-ad').getAttribute('aria-invalid')==='true'&&P.count===0&&!pic(),'Invalid denominator cancels playback and marks exact field');assert($('fr-ad').value==='0','Invalid input retained');run(1,2,0,3,'/');assert($('fr-bn').getAttribute('aria-invalid')==='true','Zero fraction divisor has adjacent validation');
 run('1.5',2,1,3);assert($('fr-an').getAttribute('aria-invalid')==='true','Decimal numerator rejected');run('1'.repeat(81),2,1,3);assert($('lab-error').textContent,'81-digit input rejected');run('<img>',2,1,3);assert(!d.querySelector('#lab-result img'),'Input HTML never injected');
 run(1,2,1,3);input('fr-factor',3);click('lab-calculate');assert($('lab-result').textContent.includes('3/6'),'Equivalent fraction factor applied exactly');

 click('lab-replay');assert(P.position===0,'Replay resets same input');input('fr-an',2);assert(!P.playing&&P.count===0,'Input cancels stale fraction playback');click('lab-calculate');assert($('lab-result').textContent.includes('4/3'),'Updated input recalculates correctly');
 click('lab-play');d.querySelector('[data-mode=basic]').click();assert(!P.playing,'Tool change cancels fraction playback');d.querySelector('[data-mode=fraction]').click();click('tool-example');assert($('lab-result').textContent.includes('5/6'),'Try an example works');run(7,3,2,3);click('tool-reset');assert($('fr-an').value==='1'&&$('lab-result').textContent.includes('5/6'),'Reset restores default example');
 click('language-toggle');await wait(20);assert(d.querySelector('label[for=fr-an]').textContent.includes('লব')&&$('lab-steps').textContent.includes('পূর্ণ একক'),'Bengali input labels and lesson steps');assert($('lab-result').textContent.includes('নির্ভুল'),'Bengali exact-result label');click('language-toggle');
 for(const width of [320,390,768,1280]){this.style.width=width+'px';await wait(60);assert(d.documentElement.scrollWidth<=width+1,'No page overflow at '+width);}
 this.style.width='1200px';run(1,2,1,3);P.seek(2.5);P.pause();
 document.getElementById('report').textContent='PASS '+checks.length+' Fraction assertions\n'+checks.join('\n');
 }catch(e){document.getElementById('report').textContent='FAIL '+e.stack;}
};</script>
